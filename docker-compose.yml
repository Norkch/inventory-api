services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Inv_Passw0rd!}
    ports: ["127.0.0.1:1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  dbinit:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver: { condition: service_healthy }
    environment:
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Inv_Passw0rd!}
    volumes: ["./db:/db:ro"]    
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -I -b -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -i /db/init.sql"]
    restart: "no"

  api:
    build: { context: . }
    restart: on-failure
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ConnectionStrings__Inventory: "Server=sqlserver;Database=InventoryDb;User Id=sa;Password=${SA_PASSWORD:-Inv_Passw0rd!};TrustServerCertificate=True"
      Auth__Issuer: inventory-api
      Auth__Audience: inventory-api
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-dev-only-signing-key-change-it-0123456789}
      Auth__ClientId: ${AUTH_CLIENT_ID:-inventory-client}
      Auth__ClientSecret: ${AUTH_CLIENT_SECRET:-dev-only-client-secret}
      Auth__TokenLifetimeMinutes: "60"
    depends_on:
      dbinit: { condition: service_completed_successfully }

volumes:
  sqldata: