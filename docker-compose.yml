services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Inv_Passw0rd!}
    ports: ["127.0.0.1:1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  dbinit:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver: { condition: service_healthy }
    environment:
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Inv_Passw0rd!}
    volumes: ["./db:/db:ro"]    
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -I -b -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -i /db/init.sql"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      INVENTORY_CLIENT_ID: ${INVENTORY_CLIENT_ID:-inventory-client}
      INVENTORY_API_AUDIENCE: ${INVENTORY_API_AUDIENCE:-inventory-api}
      INVENTORY_CLIENT_SECRET: ${INVENTORY_CLIENT_SECRET:?set INVENTORY_CLIENT_SECRET in .env}
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]

  api:
    build: { context: . }
    restart: on-failure
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ConnectionStrings__Inventory: "Server=sqlserver;Database=InventoryDb;User Id=sa;Password=${SA_PASSWORD:-Inv_Passw0rd!};TrustServerCertificate=True"
      Auth__MetadataAddress: http://keycloak:8080/realms/inventory/.well-known/openid-configuration
      Auth__Issuer: http://localhost:8081/realms/inventory
      Auth__Audience: ${INVENTORY_API_AUDIENCE:-inventory-api}
      Auth__SwaggerClientId: ${INVENTORY_CLIENT_ID:-inventory-client}
    depends_on:
      dbinit: { condition: service_completed_successfully }
      keycloak: { condition: service_started }

volumes:
  sqldata: